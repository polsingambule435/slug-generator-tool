
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Slug Generator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #050807;
        color: #00ff88;
        font-family: Consolas, monospace;
    }

    .container {
        max-width: 700px;
        margin-top: 20px;
    }

    .terminal {
        background: #090e0c;
        border: 1px solid #00ff88;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.12);
    }

    .terminal-header {
        border-bottom: 1px solid #174a32;
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    .dots {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
    }

    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    h3 {
        color: #00ff88;
        letter-spacing: 2px;
        font-weight: bold;
    }

    .form-label {
        color: #00ff88;
        font-size: 14px;
    }

    .form-control {
        background: #030605;
        color: #00ff88;
        border: 1px solid #174a32;
        border-radius: 4px;
        padding: 12px;
        font-family: Consolas, monospace;
    }

    .form-control:focus {
        background: #030605;
        color: #00ff88;
        border-color: #00ff88;
        box-shadow: 0 0 8px rgba(0,255,136,.2);
    }

    .form-control::placeholder {
        color: #47735c;
    }

    .btn-hacker {
        background: #00ff88;
        color: #001a0d;
        border: 1px solid #00ff88;
        padding: 11px 20px;
        border-radius: 4px;
        font-weight: bold;
        transition: .2s;
    }

    .btn-hacker:hover {
        background: transparent;
        color: #00ff88;
        box-shadow: 0 0 12px rgba(0,255,136,.3);
    }

    .prompt {
        color: #00ff88;
    }

    #message {
        font-size: 13px;
        margin-top: 15px;
        min-height: 20px;
    }

    .cursor {
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    @media (max-width: 576px) {
        .container { margin-top: 40px; }
        .terminal { padding: 18px; }
        h3 { font-size: 21px; }
    }
</style>
</head>

<body>

<div class="container">

    <div class="terminal">

        <div class="terminal-header d-flex justify-content-between align-items-center">
            <div>
                <span class="dots red"></span>
                <span class="dots yellow"></span>
                <span class="dots green"></span>
            </div>
            <small style="color:#63977a;">CYBER TERMINAL v1.0</small>
        </div>

        <h3>&gt; SLUG_GENERATOR<span class="cursor">_</span></h3>

        <p style="color:#63977a;font-size:13px;">
            // Convert text into an SEO-friendly URL slug
        </p>

        <div class="mt-4">
            <label class="form-label">
                <span class="prompt">root@system:~$</span> Enter Title
            </label>

            <input type="text" id="title" class="form-control"
                placeholder="Type your title here...">
        </div>

        <div class="mt-4">
            <label class="form-label">
                <span class="prompt">root@system:~$</span> Output Slug
            </label>

            <input type="text" id="slug" class="form-control"
                placeholder="Waiting for input..." readonly>
        </div>

        <button class="btn btn-hacker mt-4" onclick="convertCopy()">
            &gt; CONVERT &amp; COPY
        </button>

        <div id="message"></div>

        <div class="mt-4 pt-3" style="border-top:1px solid #174a32;">
            <small style="color:#47735c;">
                SYSTEM STATUS: <span style="color:#00ff88;">ONLINE</span>
                &nbsp;|&nbsp; MODE: LOCAL
            </small>
        </div>

    </div>
</div>

<script>
    async function convertCopy() {
        const title = document.getElementById("title").value.trim();
        const slugField = document.getElementById("slug");
        const message = document.getElementById("message");

        if (!title) {
            message.style.color = "#ff5f56";
            message.textContent = "> ERROR: Please enter a title.";
            return;
        }

        const slug = title.toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");

        if (!slug) {
            message.style.color = "#ff5f56";
            message.textContent = "> ERROR: No valid characters found.";
            return;
        }

        slugField.value = slug;

        try {
            await navigator.clipboard.writeText(slug);
        } catch (error) {
            slugField.select();
            const copied = document.execCommand("copy");

            if (!copied) {
                message.style.color = "#ffbd2e";
                message.textContent = "> SLUG GENERATED. Copy it manually.";
                return;
            }
        }

        message.style.color = "#00ff88";
        message.textContent = "> SUCCESS: Slug generated and copied!";
    }
</script>

</body>
</html>
